<script>
  /* ============================================================
     KONFIGURASI FIREBASE
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyDLdy8_CbB7QjtByRL0If8utolYREmlGjU",
    authDomain: "savedatabase-c936c.firebaseapp.com",
    databaseURL: "https://savedatabase-c936c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "savedatabase-c936c",
    storageBucket: "savedatabase-c936c.firebasestorage.app",
    messagingSenderId: "416762367242",
    appId: "1:416762367242:web:f02d6221ddeb672d813ef3"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.database();

  const TX_PATH   = 'transactions';
  const LOCK_PATH = 'locks';
  const txRef   = db.ref(TX_PATH);
  const lockRef = db.ref(LOCK_PATH);

  const USER_EMAIL_DOMAIN = '@cryptoapp.local';

  /* ============================================================
     HELPER
     ============================================================ */
  const $ = id => document.getElementById(id);
  const loginScreen = $('loginScreen'), appScreen = $('appScreen');

  function usernameToEmail(input) {
    const v = (input || '').trim();
    if (!v) return '';
    return v.includes('@') ? v : v + USER_EMAIL_DOMAIN;
  }

  function authErrorMessage(err) {
    const code = err && err.code ? err.code : '';
    switch (code) {
      case 'auth/invalid-email':         return 'Format email tidak valid.';
      case 'auth/user-not-found':        return 'User tidak terdaftar.';
      case 'auth/wrong-password':        return 'Password salah.';
      case 'auth/invalid-credential':    return 'Username / email atau password salah.';
      case 'auth/invalid-login-credentials': return 'Username / email atau password salah.';
      case 'auth/too-many-requests':     return 'Terlalu banyak percobaan. Coba lagi nanti.';
      case 'auth/network-request-failed':return 'Koneksi jaringan bermasalah.';
      case 'auth/user-disabled':         return 'Akun ini dinonaktifkan.';
      case 'auth/missing-password':      return 'Password wajib diisi.';
      default:                            return 'Login gagal: ' + (err && err.message ? err.message : code);
    }
  }

  function toast(msg, type = 'info') {
    const box = $('toastBox');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = type === 'success' ? 'fa-check-circle'
             : type === 'error' ? 'fa-exclamation-circle'
             : type === 'warning' ? 'fa-exclamation-triangle'
             : 'fa-info-circle';
    el.innerHTML = '<i class="fas ' + ic + '"></i> <span>' + msg + '</span>';
    box.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(-16px)';
      el.style.transition = '0.3s';
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }

  /* ============================================================
     LOGIN
     ============================================================ */
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl  = $('loginError');
    const btn    = $('loginBtn');
    const rawUser= $('loginUser').value;
    const pass   = $('loginPass').value;

    errEl.style.display = 'none';

    if (!rawUser || !pass) {
      errEl.textContent = 'Username / email dan password wajib diisi.';
      errEl.style.display = 'block';
      return;
    }

    const email = usernameToEmail(rawUser);

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

    try {
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await auth.signInWithEmailAndPassword(email, pass);
      toast('Login berhasil', 'success');
      $('loginPass').value = '';
    } catch (err) {
      console.error('Login error:', err);
      errEl.textContent = authErrorMessage(err);
      errEl.style.display = 'block';
      $('loginPass').value = '';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
    }
  });

  $('btnLogout').addEventListener('click', async () => {
    try {
      await auth.signOut();
      toast('Berhasil logout', 'info');
    } catch (e) {
      toast('Gagal logout: ' + e.message, 'error');
    }
  });

  /* ============================================================
     STATE
     ============================================================ */
  let transactions = [];
  let lockedRows   = [];
  let listenerAttached = false;
  let lockListenerAttached = false;
  let appInitialized = false;

  /* ============================================================
     SORT STATE
     ============================================================ */
  let sortBy  = localStorage.getItem('sort_by')  || 'timestamp';
  let sortDir = localStorage.getItem('sort_dir') || 'asc';

  function applySortUI() {
    document.querySelectorAll('thead th.sortable').forEach(th => {
      const icon = th.querySelector('.sort-icon');
      if (!icon) return;
      if (th.dataset.sort === sortBy) {
        th.classList.add('active');
        th.dataset.dir = sortDir;
        icon.className = 'fas ' + (sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down') + ' sort-icon';
      } else {
        th.classList.remove('active');
        th.removeAttribute('data-dir');
        icon.className = 'fas fa-sort sort-icon';
      }
    });

    const sel = $('mobileSortSelect');
    if (sel && sel.value !== sortBy) sel.value = sortBy;

    const dirIcon = $('mobileSortDirIcon');
    if (dirIcon) {
      dirIcon.className = 'fas ' + (sortDir === 'asc' ? 'fa-arrow-down-short-wide' : 'fa-arrow-up-wide-short');
    }
  }

  function toggleSort(field) {
    if (sortBy === field) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortBy = field;
      sortDir = (field === 'timestamp' || field === 'tanggal') ? 'desc' : 'asc';
    }
    localStorage.setItem('sort_by', sortBy);
    localStorage.setItem('sort_dir', sortDir);
    applySortUI();
    render();
  }

  function getSortedTransactions() {
    const arr = [...transactions];
    const dir = sortDir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      switch (sortBy) {
        case 'coin': {
          const av = (a.coin || '').toString();
          const bv = (b.coin || '').toString();
          return av.localeCompare(bv, 'id', { sensitivity: 'base' }) * dir;
        }
        case 'harga': {
          return ((Number(a.harga) || 0) - (Number(b.harga) || 0)) * dir;
        }
        case 'total': {
          return ((Number(a.total) || 0) - (Number(b.total) || 0)) * dir;
        }
        case 'jumlah': {
          return ((Number(a.jumlah) || 0) - (Number(b.jumlah) || 0)) * dir;
        }
        case 'tanggal':
        case 'timestamp':
        default: {
          const av = Number(a.timestamp) || 0;
          const bv = Number(b.timestamp) || 0;
          if (av === bv) {
            return ((a.tanggal || '').toString()).localeCompare((b.tanggal || '').toString(), 'id') * dir;
          }
          return (av - bv) * dir;
        }
      }
    });
    return arr;
  }

  /* ============================================================
     AUTH STATE
     ============================================================ */
  auth.onAuthStateChanged((user) => {
    if (user) {
      loginScreen.classList.add('hidden');
      appScreen.style.display = 'block';

      const label = user.email || user.uid;
      $('userEmail').textContent = label;
      $('userChip').title = 'Login sebagai: ' + label;

      initApp();
    } else {
      loginScreen.classList.remove('hidden');
      appScreen.style.display = 'none';
      $('userEmail').textContent = '—';

      detachListeners();
      stopPriceChart();
      transactions = [];
      lockedRows   = [];
      appInitialized = false;
    }
  });

  function detachListeners() {
    try { txRef.off(); } catch (e) {}
    try { lockRef.off(); } catch (e) {}
    listenerAttached = false;
    lockListenerAttached = false;
  }

  /* ============================================================
     THEME
     ============================================================ */
  const themeToggle = $('themeToggle'), themeIcon = $('themeIcon'), htmlEl = document.documentElement;
  function getPreferredTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyTheme(theme) {
    if (theme === 'light') { htmlEl.setAttribute('data-theme', 'light'); themeIcon.className = 'fas fa-sun'; }
    else { htmlEl.removeAttribute('data-theme'); themeIcon.className = 'fas fa-moon'; }
    localStorage.setItem('theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6fa' : '#0a0d14');
  }
  applyTheme(getPreferredTheme());

  /* ============================================================
     MODAL
     ============================================================ */
  const modalOverlay = $('modalOverlay');
  const modalClose   = $('modalClose');
  const btnOpenModal = $('btnOpenModal');
  const fabAdd       = $('fabAdd');
  const txForm       = $('txForm');

  let formDirty = false;
  function markDirty() { formDirty = true; }

  function resetFormFields() {
    txForm.reset();
    $('inCoin').value  = 'DOGE';
    $('inDate').value  = getTodayLocal();
    $('inPrice').value = '';
    $('inTotal').value = '';
    $('inPrice').classList.remove('invalid');
    $('inTotal').classList.remove('invalid');
    $('coinPreview').textContent = '0';
    formDirty = false;
  }

  function openModal() {
    resetFormFields();
    modalOverlay.classList.add('active');
    modalOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    const cp = parseFloat($('curPrice').value);
    if (cp > 0) {
      $('inPrice').value = Math.round(cp);
      updateCoinPreview();
    }

    setTimeout(() => {
      $('inPrice').focus();
      $('inPrice').select();
    }, 200);
  }

  function closeModal(force = false) {
    if (!force && formDirty) {
      const ok = confirm('Data form belum disimpan. Yakin ingin menutup?');
      if (!ok) return;
    }
    modalOverlay.classList.remove('active');
    modalOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    setTimeout(resetFormFields, 300);
  }

  function getTodayLocal() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function updateCoinPreview() {
    const harga = parseFloat($('inPrice').value) || 0;
    const total = parseFloat($('inTotal').value) || 0;
    const jumlah = (harga > 0 && total > 0) ? (total / harga) : 0;
    $('coinPreview').textContent = jumlah > 0
      ? jumlah.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 6 })
      : '0';
  }

  btnOpenModal.addEventListener('click', openModal);
  fabAdd.addEventListener('click', openModal);
  modalClose.addEventListener('click', () => closeModal(false));

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
      closeModal(false);
    }
  });

  ['inCoin', 'inDate', 'inPrice', 'inTotal'].forEach(id => {
    const el = $(id);
    el.addEventListener('input',  () => { markDirty(); updateCoinPreview(); });
    el.addEventListener('change', () => { markDirty(); updateCoinPreview(); });
  });

  window.addEventListener('scroll', () => {
    if (window.scrollY > 10) $('mainHeader').classList.add('is-scrolled');
    else $('mainHeader').classList.remove('is-scrolled');
  }, { passive: true });

  /* ============================================================
     FORMATTER
     ============================================================ */
  function fRp(n) {
    if (n == null || isNaN(n)) return 'Rp 0';
    const abs = Math.abs(n);
    const s = abs.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return (n < 0 ? '-' : '') + 'Rp ' + s;
  }
  function fKoin(n) {
    if (!n || isNaN(n)) return '0';
    return n.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
  }
  function getTrendIcon(buyPrice, curPrice) {
    if (!curPrice || curPrice <= 0 || !buyPrice || buyPrice <= 0)
      return '<span class="trend-icon trend-flat"><i class="fas fa-minus"></i></span>';
    if (curPrice > buyPrice) return '<span class="trend-icon trend-up"><i class="fas fa-caret-up"></i></span>';
    if (curPrice < buyPrice) return '<span class="trend-icon trend-down"><i class="fas fa-caret-down"></i></span>';
    return '<span class="trend-icon trend-flat"><i class="fas fa-minus"></i></span>';
  }

  /* ============================================================
     MODE HARGA: AUTO / MANUAL
     ============================================================ */
  let autoPriceMode = localStorage.getItem('price_auto_mode') !== 'false';
  let isAutoUpdating = false;

  function applyPriceModeUI() {
    const wrap = $('priceInputWrapper');
    const badge = $('priceModeBadge');
    const text  = $('priceModeText');
    const hint  = $('cpHint');
    const hintText = $('cpHintText');

    if (autoPriceMode) {
      wrap.classList.add('auto'); wrap.classList.remove('manual');
      badge.classList.add('auto'); badge.classList.remove('manual');
      text.textContent = 'AUTO';
      hint.classList.add('auto'); hint.classList.remove('manual');
      hintText.textContent = 'Harga diambil otomatis dari grafik & diperbarui setiap 30 detik.';
    } else {
      wrap.classList.add('manual'); wrap.classList.remove('auto');
      badge.classList.add('manual'); badge.classList.remove('auto');
      text.textContent = 'MANUAL';
      hint.classList.add('manual'); hint.classList.remove('auto');
      hintText.textContent = 'Mode MANUAL — kamu mengisi harga sendiri. Klik badge untuk kembali ke AUTO.';
    }
  }

  $('priceModeBadge').addEventListener('click', () => {
    autoPriceMode = !autoPriceMode;
    localStorage.setItem('price_auto_mode', autoPriceMode ? 'true' : 'false');
    applyPriceModeUI();

    if (autoPriceMode) {
      toast('Mode AUTO aktif — harga mengikuti grafik', 'success');
      if (lastPrice != null) {
        isAutoUpdating = true;
        $('curPrice').value = Math.round(lastPrice);
        isAutoUpdating = false;
        calc();
      } else {
        fetchDogecoinPrice().then(() => calc());
      }
    } else {
      toast('Mode MANUAL aktif — kamu bisa isi harga sendiri', 'info');
    }
  });

  /* ============================================================
     HANDLER HARGA MANUAL
     ============================================================ */
  function handleManualPriceInput() {
    if (isAutoUpdating) return;

    if (autoPriceMode) {
      autoPriceMode = false;
      localStorage.setItem('price_auto_mode', 'false');
      applyPriceModeUI();
      toast('Beralih ke mode MANUAL', 'info');
    }

    calc();
  }

  $('curPrice').addEventListener('input',  handleManualPriceInput);
  $('curPrice').addEventListener('change', handleManualPriceInput);

  /* ============================================================
     GRAFIK REAL-TIME — CoinGecko + PERSISTENSI localStorage
     ============================================================ */
  const COINGECKO_URL = 'https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=idr&include_24hr_change=true';
  const MAX_DATA_POINTS = 60;
  const REFRESH_INTERVAL = 30000;

  // ===== KEY UNTUK PERSISTENSI GRAFIK =====
  const CHART_STORAGE_KEY = 'doge_chart_v1';

  let priceChart = null;
  let chartLabels = [];
  let chartData   = [];
  let lastPrice   = null;
  let chartFetchTimer = null;

  /* -------- Simpan chart ke localStorage -------- */
  function saveChartToStorage() {
    try {
      localStorage.setItem(CHART_STORAGE_KEY, JSON.stringify({
        labels: chartLabels,
        data: chartData,
        lastPrice: lastPrice,
        savedAt: Date.now()
      }));
    } catch (e) {
      console.warn('Gagal simpan chart ke localStorage:', e);
    }
  }

  /* -------- Muat chart dari localStorage -------- */
  function loadChartFromStorage() {
    try {
      const raw = localStorage.getItem(CHART_STORAGE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.labels) || !Array.isArray(parsed.data)) return false;

      chartLabels = parsed.labels.slice(-MAX_DATA_POINTS);
      chartData   = parsed.data.slice(-MAX_DATA_POINTS);
      lastPrice   = typeof parsed.lastPrice === 'number' ? parsed.lastPrice : null;

      // Tampilkan harga terakhir di label & input (jika mode AUTO)
      if (lastPrice != null) {
        $('chartPriceLabel').textContent = fRp(lastPrice);
        if (autoPriceMode) {
          isAutoUpdating = true;
          $('curPrice').value = Math.round(lastPrice);
          isAutoUpdating = false;
        }
        calc();
      }

      // Update status
      const statusEl = $('chartStatusText');
      if (statusEl) {
        const savedAt = parsed.savedAt ? new Date(parsed.savedAt).toLocaleTimeString('id-ID') : '-';
        statusEl.textContent = 'Data tersimpan (terakhir ' + savedAt + ') — memuat...';
      }
      return chartLabels.length > 0;
    } catch (e) {
      console.warn('Gagal load chart dari localStorage:', e);
      return false;
    }
  }

  function initChart() {
    const ctx = $('priceChart').getContext('2d');
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const gridColor = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
    const textColor = isLight ? '#5a6478' : '#7a8ba8';

    priceChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartLabels,
        datasets: [{
          label: 'DOGE / IDR',
          data: chartData,
          borderColor: '#f0b90b',
          backgroundColor: 'rgba(240,185,11,0.12)',
          borderWidth: 2,
          tension: 0.35,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: '#f0b90b',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isLight ? '#fff' : '#151b28',
            titleColor: isLight ? '#131a2b' : '#e6edf5',
            bodyColor: isLight ? '#131a2b' : '#e6edf5',
            borderColor: isLight ? '#d1d9e6' : '#253045',
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              label: function (context) {
                return 'Rp ' + Number(context.parsed.y).toLocaleString('id-ID', { maximumFractionDigits: 2 });
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: gridColor, drawBorder: false },
            ticks: { color: textColor, font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 6 }
          },
          y: {
            grid: { color: gridColor, drawBorder: false },
            ticks: {
              color: textColor,
              font: { family: 'JetBrains Mono', size: 10 },
              maxTicksLimit: 8,
              autoSkip: true,
              callback: function (v) {
                if (v >= 1000000) return (v / 1000000).toFixed(2) + 'jt';
                if (v >= 1000)    return (v / 1000).toFixed(2) + 'rb';
                if (v >= 100)     return v.toFixed(0);
                return v.toFixed(2);
              }
            }
          }
        },
        animation: { duration: 400, easing: 'easeOutQuart' }
      }
    });
  }

  async function fetchDogecoinPrice() {
    const statusEl = $('chartStatusText');
    const dotEl = $('chartStatus').querySelector('.dot');
    try {
      const res = await fetch(COINGECKO_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const doge = json.dogecoin;
      if (!doge || typeof doge.idr !== 'number') throw new Error('Data tidak valid');

      const price = doge.idr;
      const change24h = typeof doge.idr_24h_change === 'number' ? doge.idr_24h_change : 0;

      $('chartPriceLabel').textContent = fRp(price);
      const changeEl = $('chartChangeLabel');
      const isUp = change24h >= 0;
      changeEl.style.color = isUp ? 'var(--green)' : 'var(--accent)';
      changeEl.style.background = isUp ? 'rgba(0,214,143,0.1)' : 'rgba(233,69,96,0.1)';
      changeEl.innerHTML = (isUp ? '+' : '') + change24h.toFixed(2) + '% ' +
        (isUp ? '<i class="fas fa-caret-up"></i>' : '<i class="fas fa-caret-down"></i>');

      statusEl.textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID');
      dotEl.classList.remove('off');

      const now = new Date();
      const label = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      chartLabels.push(label);
      chartData.push(price);
      while (chartLabels.length > MAX_DATA_POINTS) {
        chartLabels.shift();
        chartData.shift();
      }
      if (priceChart) priceChart.update('none');

      lastPrice = price;

      // ===== SIMPAN KE LOCALSTORAGE SETIAP UPDATE =====
      saveChartToStorage();

      if (autoPriceMode) {
        const curPriceInput = $('curPrice');
        const newVal = String(Math.round(price));
        if (curPriceInput.value !== newVal) {
          isAutoUpdating = true;
          curPriceInput.value = newVal;
          isAutoUpdating = false;
          calc();
        }
      }

      return price;
    } catch (err) {
      console.warn('Gagal ambil harga DOGE:', err);
      statusEl.textContent = 'Gagal memperbarui — coba lagi';
      dotEl.classList.add('off');
      return null;
    }
  }

  function startPriceChart() {
    if (priceChart) return;

    // ===== LOAD DARI LOCALSTORAGE DULU =====
    loadChartFromStorage();

    initChart();
    if (chartLabels.length) priceChart.update('none');

    fetchDogecoinPrice();
    chartFetchTimer = setInterval(fetchDogecoinPrice, REFRESH_INTERVAL);
  }

  function stopPriceChart() {
    if (chartFetchTimer) {
      clearInterval(chartFetchTimer);
      chartFetchTimer = null;
    }
  }

  // Ganti tema → re-init chart (tetap pakai data yang ada)
  themeToggle.addEventListener('click', () => {
    setTimeout(() => {
      if (priceChart) {
        priceChart.destroy();
        priceChart = null;
        initChart();
        if (chartLabels.length) priceChart.update('none');
      }
    }, 100);
  });

  /* ============================================================
     KONEKSI FIREBASE
     ============================================================ */
  async function checkConn() {
    const dot = $('statusDot'), txt = $('statusText');
    dot.className = 'status-dot';
    txt.textContent = 'Memeriksa...';
    try {
      await Promise.race([
        txRef.limitToLast(1).once('value'),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
      ]);
      dot.className = 'status-dot ok';
      txt.textContent = 'Terhubung';
      return true;
    } catch (e) {
      dot.className = 'status-dot';
      txt.textContent = 'Offline';
      return false;
    }
  }

  function attachRealtimeListener() {
    if (listenerAttached) return;
    listenerAttached = true;

    txRef.on('value', (snap) => {
      const val = snap.val() || {};
      transactions = Object.keys(val)
        .map(k => Object.assign({ id: k }, val[k]))
        .sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));

      localStorage.setItem('doge_tx', JSON.stringify(transactions));
      render(); calc();
    }, (err) => {
      console.warn('Firebase read error:', err);
      toast('Gagal membaca Firebase: ' + (err.message || ''), 'warning');
      transactions = JSON.parse(localStorage.getItem('doge_tx') || '[]');
      render(); calc();
    });
  }

  function syncLocks() {
    if (lockListenerAttached) return;
    lockListenerAttached = true;
    lockRef.on('value', (snap) => {
      const val = snap.val() || {};
      lockedRows = Object.keys(val);
      localStorage.setItem('doge_locks', JSON.stringify(lockedRows));
      render();
    }, () => {});
  }

  /* ============================================================
     CRUD
     ============================================================ */
  async function addTx(tx) {
    const user = auth.currentUser;
    const payload = {
      coin: tx.coin,
      tanggal: tx.tanggal,
      harga: Number(tx.harga),
      total: Number(tx.total),
      jumlah: tx.harga > 0 ? Number(tx.total) / Number(tx.harga) : 0,
      timestamp: Date.now(),
      createdAt: new Date().toISOString(),
      createdBy: user ? (user.email || user.uid) : 'unknown'
    };

    try {
      const newRef = await txRef.push(payload);
      console.log('✅ Tersimpan di Firebase:', TX_PATH + '/' + newRef.key);
      toast('Transaksi tersimpan', 'success');
      return true;
    } catch (e) {
      console.error('❌ Gagal simpan ke Firebase:', e);
      toast('GAGAL simpan: ' + (e.message || 'periksa rules'), 'error');
      return false;
    }
  }

  async function delTx(id) {
    if (lockedRows.includes(id)) { toast('Transaksi terkunci!', 'warning'); return; }
    try {
      await db.ref(TX_PATH + '/' + id).remove();
      toast('Transaksi dihapus', 'success');
    } catch (e) {
      console.error('Gagal hapus:', e);
      toast('Gagal hapus: ' + (e.message || ''), 'error');
    }
  }

  function toggleLock(id) {
    const isLocked = lockedRows.includes(id);
    if (isLocked) {
      lockRef.child(id).remove()
        .then(() => toast('Kunci dibuka', 'info'))
        .catch(e => toast('Gagal buka kunci: ' + e.message, 'error'));
    } else {
      lockRef.child(id).set(true)
        .then(() => toast('Transaksi dikunci', 'success'))
        .catch(e => toast('Gagal kunci: ' + e.message, 'error'));
    }
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    const tbody = $('tBody');
    const cur = parseFloat($('curPrice').value) || 0;

    if (!transactions.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><p>Belum ada transaksi.</p></div></td></tr>';
      $('tCnt').textContent = '0 transaksi';
      return;
    }

    const sorted = getSortedTransactions();

    tbody.innerHTML = sorted.map((t, i) => {
      const isLocked = lockedRows.includes(t.id);
      return '<tr>' +
        '<td data-label="No" style="color:var(--muted)">' + (i + 1) + '</td>' +
        '<td data-label="Coin"><span class="td-coin">' + (t.coin || 'DOGE') + '</span></td>' +
        '<td data-label="Tanggal & Waktu"><span class="td-date">' + (t.tanggal || '-') + '</span></td>' +
        '<td data-label="Harga Satuan">' + fRp(t.harga) + '</td>' +
        '<td data-label="Total Belanja" class="td-total">' + fRp(t.total) + '</td>' +
        '<td data-label="Jumlah Koin" class="td-jumlah">' + fKoin(t.jumlah) + '</td>' +
        '<td data-label="P/L">' + getTrendIcon(Number(t.harga), cur) + '</td>' +
        '<td data-label="Aksi"><div class="action-group">' +
          '<button type="button" class="btn-action ' + (isLocked ? 'locked' : '') + '" data-action="lock" data-id="' + t.id + '" title="' + (isLocked ? 'Buka kunci' : 'Kunci baris') + '">' +
            '<i class="fas ' + (isLocked ? 'fa-lock' : 'fa-lock-open') + '"></i></button>' +
          '<button type="button" class="btn-action btn-del" data-action="del" data-id="' + t.id + '" ' + (isLocked ? 'disabled' : '') + ' title="Hapus">' +
            '<i class="fas fa-trash-alt"></i></button>' +
        '</div></td>' +
      '</tr>';
    }).join('');

    $('tCnt').textContent = transactions.length + ' transaksi';
  }

  $('tBody').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if (action === 'lock') {
      toggleLock(id);
    } else if (action === 'del') {
      if (btn.disabled) return;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      btn.disabled = true;
      delTx(id);
    }
  });

  /* ============================================================
     SORT EVENT LISTENERS
     ============================================================ */
  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.addEventListener('click', () => toggleSort(th.dataset.sort));
  });

  $('mobileSortSelect').addEventListener('change', (e) => {
    sortBy = e.target.value;
    sortDir = (sortBy === 'timestamp' || sortBy === 'tanggal') ? 'desc' : 'asc';
    localStorage.setItem('sort_by', sortBy);
    localStorage.setItem('sort_dir', sortDir);
    applySortUI();
    render();
  });

  $('mobileSortDir').addEventListener('click', () => {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    localStorage.setItem('sort_dir', sortDir);
    applySortUI();
    render();
  });

  /* ============================================================
     KALKULASI
     ============================================================ */
  function calc() {
    let tKoin = 0, tModal = 0;
    transactions.forEach(t => {
      tKoin += Number(t.jumlah) || 0;
      tModal += Number(t.total) || 0;
    });

    const avg = tKoin > 0 ? tModal / tKoin : 0;
    const cur = parseFloat($('curPrice').value) || 0;
    const curVal = tKoin * cur;
    const pnl = curVal - tModal;
    const pnlPct = tModal > 0 ? (pnl / tModal) * 100 : 0;

    $('sKoin').textContent = fKoin(tKoin);
    $('sModal').textContent = fRp(tModal);
    $('sAvg').textContent = fRp(avg);

    const pnlEl = $('sPnl');
    const pctEl = $('sPnlPct');
    pnlEl.innerHTML = fRp(pnl) + ' ' + getTrendIcon(avg, cur);
    pnlEl.className = 'card-value ' + (pnl >= 0 ? 't-g' : 't-r');
    pctEl.innerHTML = (pnl >= 0 ? '+' : '') + pnlPct.toFixed(2) + '% ' + getTrendIcon(avg, cur);
    pctEl.style.color = pnl >= 0 ? 'var(--green)' : 'var(--accent)';

    if (cur > 0 && tKoin > 0) {
      $('pnlBar').style.display = 'block';
      $('pnCur').innerHTML = fRp(curVal);
      $('pnCost').innerHTML = fRp(tModal);
      $('pnAmt').innerHTML = fRp(pnl) + ' ' + getTrendIcon(avg, cur);
      $('pnAmt').className = 'pnl-val ' + (pnl >= 0 ? 't-g' : 't-r');
      $('pnPct').innerHTML = (pnl >= 0 ? '+' : '') + pnlPct.toFixed(2) + '% ' + getTrendIcon(avg, cur);
      $('pnPct').style.color = pnl >= 0 ? 'var(--green)' : 'var(--accent)';

      const prog = Math.max(0, Math.min(100, 50 + pnlPct / 2));
      const fill = $('pnFill');
      fill.style.width = prog + '%';
      fill.style.background = pnl >= 0
        ? 'linear-gradient(90deg,var(--green),var(--green2))'
        : 'linear-gradient(90deg,var(--accent),#ff6b81)';
    } else {
      $('pnlBar').style.display = 'none';
    }

    render();
  }

  /* ============================================================
     SUBMIT TRANSAKSI
     ============================================================ */
  txForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!auth.currentUser) {
      toast('Sesi habis, silakan login ulang', 'error');
      return;
    }

    const coin = $('inCoin').value;
    const tanggalInput = $('inDate').value;
    const tanggalFinal = tanggalInput + ' ' + new Date().toTimeString().slice(0, 5);
    const harga = parseFloat($('inPrice').value);
    const total = parseFloat($('inTotal').value);

    $('inPrice').classList.remove('invalid');
    $('inTotal').classList.remove('invalid');

    if (!tanggalInput) {
      toast('Tanggal harus diisi', 'error');
      $('inDate').focus();
      return;
    }
    if (!harga || harga <= 0) {
      toast('Harga satuan harus lebih dari 0', 'error');
      $('inPrice').classList.add('invalid');
      $('inPrice').focus();
      return;
    }
    if (!total || total <= 0) {
      toast('Total belanja harus lebih dari 0', 'error');
      $('inTotal').classList.add('invalid');
      $('inTotal').focus();
      return;
    }

    const btn = $('btnAdd');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

    const ok = await addTx({ coin, tanggal: tanggalFinal, harga, total });

    if (ok) {
      formDirty = false;
      closeModal(true);
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Simpan Transaksi';
  });

  /* ============================================================
     PARTICLES + CLOCK
     ============================================================ */
  function initParticles() {
    const c = $('particles');
    if (c.dataset.init === '1') return;
    c.dataset.init = '1';
    const colors = ['rgba(233,69,96,0.3)', 'rgba(240,185,11,0.25)', 'rgba(0,214,143,0.2)'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const sz = 2 + Math.random() * 4;
      p.style.width = sz + 'px';
      p.style.height = sz + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-10px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (10 + Math.random() * 18) + 's';
      p.style.animationDelay = Math.random() * 12 + 's';
      c.appendChild(p);
    }
  }

  function updateClock() {
    const now = new Date();
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const dayName = days[now.getDay()];
    const d = now.getDate();
    const m = months[now.getMonth()];
    const y = now.getFullYear();
    const time = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    if ($('liveClock')) $('liveClock').textContent = dayName + ', ' + d + ' ' + m + ' ' + y + ' | ' + time;
  }
  setInterval(updateClock, 1000);

  /* ============================================================
     INIT
     ============================================================ */
  async function initApp() {
    if (appInitialized) return;
    appInitialized = true;

    applyPriceModeUI();
    applySortUI();
    initParticles();
    updateClock();
    startPriceChart();
    await checkConn();
    attachRealtimeListener();
    syncLocks();
  }
</script>
